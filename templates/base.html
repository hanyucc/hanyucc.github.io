<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ site.title }}{% endblock %}</title>
<meta name="description" content="{{ site.description }}">
<meta name="author" content="{{ profile.name }}">
<link rel="canonical" href="{{ site.url }}/">

<meta property="og:type" content="profile">
<meta property="og:title" content="{{ site.title }}">
<meta property="og:description" content="{{ site.description }}">
<meta property="og:url" content="{{ site.url }}/">
<meta property="og:image" content="{{ site.url }}/{{ profile.photo }}">
<meta name="twitter:card" content="summary">

<link rel="icon" href="static/favicon.svg" type="image/svg+xml">
<link rel="preload" href="static/fonts/newsreader-roman.woff2?v=__V__" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="static/fonts/plex-mono-400.woff2?v=__V__" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="static/style.css?v=__V__">
{% if site.analytics_id %}
<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.analytics_id }}"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', '{{ site.analytics_id }}');
</script>
{% endif %}
</head>
<body>
{% block content %}{% endblock %}
{% block scripts %}{% endblock %}
</body>
</html>

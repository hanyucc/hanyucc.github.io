# Inline links are the only markup allowed here.
bio: >-
  I am a second-year Ph.D. student in Computer Science at
  <a href="https://www.cornell.edu/">Cornell University</a>, advised by Professor
  <a href="https://www.cs.cornell.edu/~snavely/">Noah Snavely</a>.
  Before starting my Ph.D., I received my M.S. and B.S. in Computer Science from
  <a href="https://www.cmu.edu/">Carnegie Mellon University</a>, where I was advised by
  Professor <a href="https://www.cs.cmu.edu/~igkioule/">Ioannis Gkioulekas</a>.
  My research interest lies in differentiable and neural rendering for 3D
  reconstruction, and more broadly at the intersection of graphics and 3D vision.

